name: Keep Render awake

on:
  schedule:
    # Every 10 minutes — Render free tier sleeps after 15 min idle
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://ezmeet-3bx7.onrender.com/health)
          echo "Health check returned HTTP $status"
          if [ "$status" != "200" ]; then
            exit 1
          fi
